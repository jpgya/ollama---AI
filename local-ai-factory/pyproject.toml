[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-factory"
version = "0.1.0"
description = "A safety-first local software development factory powered by Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
local-ai-factory = "local_ai_factory.cli:main"

[tool.setuptools.packages.find]
include = ["local_ai_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
